<!--
    layouts/_shortcodes/discord/widget.html

    Embeds Discord's own server widget — member list plus a join link.
    Takes the guild (server) ID.

    Usage (shortcode braces omitted below — Go templates parse them even
    inside an HTML comment, which breaks the build):
      < discord/widget <guild-id> >

    The guild's widget must be enabled in Server Settings for this to render.
-->

<div class="embed discord-widget">
    <iframe width="350" height="400" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
    src="https://discord.com/widget?id={{ index .Params 0 }}&theme=dark"></iframe>
</div>
